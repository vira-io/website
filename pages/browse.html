<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Przegladaj biblioteki - vira.io</title>
<link rel="icon" href="../images/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../styles/main.css" />
</head>
<body>

<canvas id="bg-canvas"></canvas>

<nav class="site-nav">
  <div class="wrap">
    <a class="brand" href="../index.html">
      <img src="../images/logo.png" alt="" />
      vira.io
    </a>
    <div class="nav-links">
      <a href="browse.html" class="active">Przegladaj</a>
      <a href="docs.html">Dokumentacja</a>
      <a href="about.html">O projekcie</a>
      <a class="nav-cta" href="docs.html#publikowanie">Opublikuj biblioteke</a>
    </div>
    <button class="nav-toggle" aria-label="Menu">&#9776;</button>
  </div>
</nav>

<header class="page-header">
  <div class="wrap">
    <h1>Przegladaj biblioteki</h1>
    <p>Pelna lista z rejestru <code>vira-io/repository</code> - filtruj po typie albo szukaj po nazwie.</p>
  </div>
</header>

<section class="section" style="border-top:none; padding-top:0;">
  <div class="wrap">
    <div class="search-box" style="margin-bottom: 22px;">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search-input" placeholder="Szukaj po nazwie lub opisie..." autocomplete="off" />
    </div>

    <div class="filter-bar" id="filter-bar">
      <button class="filter-chip active" data-type="all">Wszystkie</button>
      <button class="filter-chip" data-type="git">git</button>
      <button class="filter-chip" data-type="static-lib">static-lib</button>
      <button class="filter-chip" data-type="shared-lib">shared-lib</button>
      <button class="filter-chip" data-type="rust-lib">rust-lib</button>
      <button class="filter-chip" data-type="hlib">hlib</button>
    </div>

    <p class="search-meta" id="result-count" style="margin-bottom: 18px;"></p>

    <div class="pkg-grid" id="results-grid"></div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-bottom">
      <span>&copy; 2026 Vira - czesc ekosystemu HackerScript / HackerOS</span>
      <a href="https://github.com/vira-io/repository">Rejestr na GitHub</a>
    </div>
  </div>
</footer>

<script src="../js/packages.js"></script>
<script src="../js/main.js"></script>
<script>
  let allPackages = [];
  let currentType = "all";
  let currentQuery = new URLSearchParams(window.location.search).get("q") || "";

  const grid = document.getElementById("results-grid");
  const countEl = document.getElementById("result-count");
  const searchInput = document.getElementById("search-input");
  searchInput.value = currentQuery;

  function applyFilters() {
    let result = ViraPackages.filterByType(allPackages, currentType);
    result = ViraPackages.search(result, currentQuery);
    ViraPackages.renderGrid(grid, result);
    countEl.textContent = result.length + " bibliotek(a) znaleziona(ych)" + (currentQuery ? ` dla "${currentQuery}"` : "");
  }

  ViraPackages.loadInto(grid, {
    onLoaded: (pkgs) => {
      allPackages = pkgs;
      applyFilters();
    },
  });

  searchInput.addEventListener("input", (e) => {
    currentQuery = e.target.value;
    applyFilters();
  });

  document.querySelectorAll(".filter-chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      document.querySelectorAll(".filter-chip").forEach((c) => c.classList.remove("active"));
      chip.classList.add("active");
      currentType = chip.getAttribute("data-type");
      applyFilters();
    });
  });
</script>
</body>
</html>
